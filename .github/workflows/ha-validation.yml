name: Home Assistant validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  home-assistant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Supplemental until green; the existing mocked component job stays required.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-readability.txt
      - name: Verify installed core
        run: |
          python -c "import homeassistant.core; from importlib.metadata import version; assert version('homeassistant') == '2026.11.1'"
      - name: Collect component tests
        run: python -m pytest --collect-only -q tests
      - name: Run component tests with core installed
        run: python -m pytest tests
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reporting until issue #424 fixes manifest key order and the invalid services response option, then makes this job blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # 2026-10-26
