name: Readability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install hosted guard tools
        run: |
          python -m pip install "$(sed -n '/^ruff==/p' requirements-readability.txt)"
      - run: python3 scripts/check_readability.py --self-test
      - run: python3 -m unittest discover -s tests -p 'test_validation_workflows.py' -v
      - run: python3 scripts/check_readability.py --check
