name: Import boundaries
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  private-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_private_import_gate.py' -v
      - run: python3 scripts/check_private_imports.py --check
